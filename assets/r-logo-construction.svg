.draft-note{fill:#80b6cd;font:28px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;opacity:.95}
.draft-sub{fill:#81a7b8;font:21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.3px;opacity:.78}
.draft-node{fill:#77b5d1;stroke:#142026;stroke-width:2;opacity:.95}
.draft-guide{animation:guide-rise 1.5s ease-out both}
.draft-highlight{stroke-dasharray:100;stroke-dashoffset:100;animation:trace 1.65s .15s ease-in-out forwards}

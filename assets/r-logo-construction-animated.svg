<style>
.grid{opacity:0;animation:grid-in 1.0s .08s ease forwards}
.guides-finish{animation:guides-soft 1.1s 4.2s ease forwards}
.guide-intro{opacity:0;animation:appear .65s var(--delay,0s) ease forwards}
.guide-draw{stroke-width:1.75;fill:none;opacity:.65;stroke-dasharray:100;stroke-dashoffset:100;animation:circle-trace 1.48s var(--delay,0s) cubic-bezier(.22,.02,.17,1) forwards}
.guide-draw.small{stroke:#a8b7bd;stroke-width:1.35}
.arc-draw{fill:none;stroke:#088FC9;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:arc-trace 1.12s var(--delay,0s) ease-out forwards}
.guide-helper{fill:none;stroke:#8aa5b2;stroke-width:1.2;opacity:0;stroke-dasharray:4 10;animation:leader-in .6s var(--delay,1.2s) ease forwards}
.node{fill:none;stroke:#7da9be;stroke-width:1.4;opacity:0;animation:appear .3s var(--delay,1.5s) ease forwards}
.node circle{fill:#088FC9;stroke:none}
.callout{font:23px ui-monospace,Consolas,monospace;fill:#aec3cc;letter-spacing:1px;opacity:0;animation:leader-in .5s var(--delay,1.3s) ease forwards}
.callout tspan{font-size:18px;fill:#95b0bb}
.detail-line{fill:none;stroke:#8da8b5;stroke-width:1.2;stroke-dasharray:5 9;opacity:0;animation:leader-in .6s 1.7s ease forwards}
.master{fill:white;mask:url(#formation-mask)}
.wipe{stroke-dasharray:100;stroke-dashoffset:100;animation:wipe-in 2.35s cubic-bezier(.22,.04,.12,1) forwards}
.wipe.w1{animation-delay:1.28s}
.wipe.w2{animation-delay:1.95s;animation-duration:1.95s}
.wipe.w3{animation-delay:2.63s;animation-duration:1.4s}
.finish-mask{opacity:0;animation:finish-fill .75s 3.62s ease-in-out forwards}
.trace{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:100;stroke-dashoffset:100;opacity:.58;animation:trace-logo 2.35s 1.23s ease-out forwards,clear-trace .6s 3.70s ease-out forwards}
@keyframes grid-in{to{opacity:.24}}
@keyframes appear{to{opacity:.9}}
@keyframes leader-in{to{opacity:.7}}
@keyframes circle-trace{to{stroke-dashoffset:0;opacity:.66}}
@keyframes arc-trace{to{stroke-dashoffset:0;opacity:.9}}
@keyframes wipe-in{to{stroke-dashoffset:0}}
@keyframes trace-logo{to{stroke-dashoffset:0}}
@keyframes clear-trace{to{opacity:0}}
@keyframes finish-fill{to{opacity:1}}
@keyframes guides-soft{to{opacity:.68}}
@media(prefers-reduced-motion:reduce){
.grid{animation:none;opacity:.22}
.guides-finish{animation:none}
.guide-intro,.guide-helper,.node,.callout,.detail-line{animation:none;opacity:.65}
.guide-draw,.arc-draw{animation:none;stroke-dashoffset:0;opacity:.68}
.wipe{animation:none;stroke-dashoffset:0}
.finish-mask{animation:none;opacity:1}
.trace{animation:none;opacity:0}
}
</style>

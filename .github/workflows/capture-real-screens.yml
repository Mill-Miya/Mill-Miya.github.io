name: Capture real project interfaces
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-real-screens.yml"
      - ".github/scripts/capture_real_screens.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot tools
        run: |
          python -m pip install "playwright==1.56.0" "Pillow>=10,<13" "PySide6>=6.7,<7"
          python -m playwright install --with-deps chromium
      - name: Capture actual apps
        run: python .github/scripts/capture_real_screens.py
      - name: Retain evidence screenshots
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-real-screenshot-evidence
          path: screenshots-raw/*.png
          retention-days: 7
      - name: Publish captured files to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects/*.webp
          git commit -m "Capture real public app UI and native Qt settings window"
          git push origin HEAD:refs/heads/assets/real-project-screens-20261118

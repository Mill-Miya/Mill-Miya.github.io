name: Portfolio visual QA
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - ".github/scripts/qa_portfolio.py"
      - ".github/workflows/portfolio-visual-qa.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/scripts/qa_portfolio.py"
      - ".github/workflows/portfolio-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Install Japanese font for accurate visual inspection
        timeout-minutes: 3
        run: |
          if ! fc-match -f '%{family}' 'Noto Sans CJK JP' | rg -q 'Noto Sans CJK'; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-cjk
            fc-cache -f
          fi
          fc-match -f '%{family}' 'Noto Sans CJK JP' | rg 'Noto Sans CJK'
      - name: Check 15 widths and page controls
        run: python .github/scripts/qa_portfolio.py
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-layout-evidence
          path: qa-evidence/*.png
          retention-days: 5
          if-no-files-found: warn

      - name: Upload standalone static preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-site
          path: |
            index.html
            assets/
          retention-days: 5
          if-no-files-found: error

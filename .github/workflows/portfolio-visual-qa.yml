name: Portfolio visual QA
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - ".github/scripts/qa_portfolio.py"
      - ".github/workflows/portfolio-visual-qa.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/scripts/qa_portfolio.py"
      - ".github/workflows/portfolio-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check 15 widths and page controls
        run: python .github/scripts/qa_portfolio.py
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-layout-evidence
          path: qa-evidence/*.png
          retention-days: 5
          if-no-files-found: warn

name: Portfolio visual QA
on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - ".github/scripts/qa_portfolio.py"
      - ".github/workflows/portfolio-visual-qa.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/scripts/qa_portfolio.py"
      - ".github/workflows/portfolio-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Install Japanese font for accurate visual inspection
        timeout-minutes: 5
        run: |
          # Only Japanese regular/bold are needed; pin official font data and verify Git blob hashes.
          qa_font_dir="$HOME/.local/share/fonts/portfolio-qa"
          mkdir -p "$qa_font_dir"
          qa_font_source="https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese"
          curl -fL --retry 1 --retry-max-time 90 --connect-timeout 15 --max-time 60 "$qa_font_source/NotoSansCJKjp-Regular.otf" -o "$qa_font_dir/NotoSansCJKjp-Regular.otf"
          curl -fL --retry 1 --retry-max-time 90 --connect-timeout 15 --max-time 60 "$qa_font_source/NotoSansCJKjp-Bold.otf" -o "$qa_font_dir/NotoSansCJKjp-Bold.otf"
          test "$(git hash-object "$qa_font_dir/NotoSansCJKjp-Regular.otf")" = "f56224957fb13a81b4c14bac34f2f058a017f9fb"
          test "$(git hash-object "$qa_font_dir/NotoSansCJKjp-Bold.otf")" = "d006db30aee377d6d8b5bb15375ef068f403f213"
          fc-cache -f "$qa_font_dir"
          fc-match -f '%{family}' 'Noto Sans CJK JP' | grep 'Noto Sans CJK'
      - name: Check 15 widths and page controls
        run: python .github/scripts/qa_portfolio.py
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-layout-evidence
          path: qa-evidence/*.png
          retention-days: 5
          if-no-files-found: warn

      - name: Upload standalone static preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview-site
          path: |
            index.html
            assets/
          retention-days: 5
          if-no-files-found: error

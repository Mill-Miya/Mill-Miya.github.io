name: Independent portfolio v2 QA
on:
  pull_request:
    paths:
      - 'site-v2/**'
      - '.github/workflows/site-v2-qa.yml'
  push:
    branches: [main]
    paths:
      - 'site-v2/**'
      - '.github/workflows/site-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-and-functional-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run twelve-width QA
        run: python site-v2/tests/qa_site.py
      - name: Preserve test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-v2-viewport-evidence
          path: site-v2/qa/*.png
          retention-days: 5
          if-no-files-found: warn
